<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guest Frame</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#f6f6f2; --ink:#1d1f24; --muted:#5d636e; --rule:#d9dad3; --panel:#ffffffee;
  --accent:#b8321f; --ok:#2f7d4f; --sel:#2b5fa8;
  --display:"Newsreader", Georgia, serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171b; --ink:#e8e8e3; --muted:#9aa0aa; --rule:#2c3038; --panel:#1d2026ee;
  --accent:#e2624c; --ok:#5cbf85; --sel:#7aa7e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15171b; --ink:#e8e8e3; --muted:#9aa0aa; --rule:#2c3038; --panel:#1d2026ee;
  --accent:#e2624c; --ok:#5cbf85; --sel:#7aa7e8; color-scheme:dark}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:13px/1.5 var(--mono)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.panel{position:fixed;top:16px;left:16px;width:min(360px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;
  background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:14px;display:grid;gap:10px;backdrop-filter:blur(6px)}
.space-nav{position:fixed;top:16px;right:16px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.space-nav a{color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:5px 9px;text-decoration:none;backdrop-filter:blur(6px)}
.space-nav a:hover,.space-nav a:focus-visible{border-color:var(--sel);color:var(--sel)}
h1{font:600 1.5rem/1.1 var(--display);margin:0}
.label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#cue{min-height:3.2em;border-left:3px solid var(--sel);padding-left:8px;overflow-wrap:anywhere}
#status.off{color:var(--accent)}
#xr:empty{display:none}
video,#frame{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<nav class="space-nav" aria-label="Space rooms"><a href="./index.html">Commons</a><a href="./xr.html">Breadboard</a><a href="./meta.html">Meta</a><a href="./agent.html">Agent</a><a href="./polytron.html">Polytron</a></nav>
<section class="panel" aria-label="Guest frame">
  <h1>Guest frame</h1>
  <p>The Plan 9 guest's own screen, as a video in the room: drag to look from any side, or enter VR.</p>
  <div><span class="label">Frame</span> <span id="status">waiting for the guest</span></div>
  <div><span class="label">Cue</span><div id="cue">—</div></div>
  <div id="xr"></div>
</section>
<canvas id="frame" width="1024" height="768"></canvas>
<video id="video" muted playsinline crossorigin="anonymous"></video>
<script type="module" src="./src/guest.ts"></script>
</body>
</html>
