<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Channel</title>
  <style>
    :root { --paper: #f6f6f2; --ink: #1d2433; --dim: #8a8f99; --line: #c9ccd2; --you: #2a6f4a; --agent: #1f4e96; --hot: #b23a2a; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #15181f; --ink: #e6e8ec; --dim: #8a8f99; --line: #3a3f4a; --you: #6cc28f; --agent: #7aa7f0; --hot: #f08a76; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
    header, main { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .status { color: var(--dim); font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    section { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    #log { height: 260px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 13px; }
    #log .author { color: var(--you); } #log .agent { color: var(--agent); }
    form { display: flex; gap: 8px; margin-top: 8px; }
    input[type=text] { flex: 1; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: inherit; }
    button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
    button[aria-pressed=true] { border-color: var(--hot); color: var(--hot); }
    #stage { height: 320px; border-radius: 6px; overflow: hidden; }
    .hasse svg { width: 100%; height: auto; }
    .hasse .edge { stroke: var(--line); stroke-width: 1; }
    .hasse image { opacity: 0.25; } .hasse image.lit { opacity: 1; } .hasse image.last { outline: 2px solid var(--hot); }
    .hasse text { fill: var(--dim); font: 11px ui-monospace, monospace; }
    .caps { color: var(--dim); font-size: 12px; margin-top: 6px; }
    nav { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    nav a { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:5px; padding:5px 9px; }
    nav a:hover, nav a:focus-visible { border-color:var(--agent); color:var(--agent); }
  </style>
</head>
<body>
  <header>
    <h1>Agent Channel</h1>
    <div class="status" id="status">connecting to the bridge on 127.0.0.1:8743 …</div>
    <nav aria-label="Space rooms"><a href="./index.html">Commons</a><a href="./xr.html">Breadboard</a><a href="./meta.html">Meta</a><a href="./examples.html">Examples</a><a href="./polytron.html">Polytron</a><a href="./metaverse.html">Living world</a></nav>
  </header>
  <main>
    <div class="grid">
      <section>
        <h2>Talk</h2>
        <div id="log" aria-live="polite"></div>
        <form id="say"><input type="text" id="text" placeholder="say something to the coding agent" autocomplete="off" /><button>Send</button></form>
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap">
          <button id="mic" aria-pressed="false">Hold to speak</button>
          <button id="speak" aria-pressed="false">Read replies aloud</button>
        </div>
        <div class="caps" id="caps"></div>
      </section>
      <section>
        <h2>Records (select one to point at it)</h2>
        <div id="stage"></div>
        <div class="caps" id="xrcaps"></div>
      </section>
    </div>
    <div class="grid" style="margin-top:16px">
      <section class="hasse"><h2>You: the 14 tickets</h2><div id="hasse-author"></div></section>
      <section class="hasse"><h2>The agent: the 14 tickets</h2><div id="hasse-agent"></div></section>
    </div>
  </main>
  <script type="module" src="./src/agent.ts"></script>
</body>
</html>
